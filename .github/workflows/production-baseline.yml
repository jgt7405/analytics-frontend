name: Production baseline

# Measures the production site with scripts/lighthouse-baseline.mjs and
# scripts/proxy-probe.mjs. Runs daily as a live-backend check (a failed run
# emails the repo owner), when the scripts or this workflow change, or on
# demand from the Actions tab.
on:
  schedule:
    - cron: "17 11 * * *" # daily, 11:17 UTC
  workflow_dispatch:
    inputs:
      base:
        description: Site to measure
        default: https://www.jthomanalytics.com
      runs:
        description: Lighthouse runs per route (median is kept)
        default: "3"
  push:
    paths:
      - scripts/lighthouse-baseline.mjs
      - scripts/proxy-probe.mjs
      - .github/workflows/production-baseline.yml

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run Lighthouse
        run: |
          npm run baseline:lighthouse -- \
            --base "${{ inputs.base || 'https://www.jthomanalytics.com' }}" \
            --runs "${{ inputs.runs || '3' }}" \
            --out lighthouse-baseline.json
      - name: Probe the backend proxy
        run: |
          npm run baseline:proxy -- \
            --base "${{ inputs.base || 'https://www.jthomanalytics.com' }}" \
            --rounds 5 \
            --strict \
            --out proxy-probe.json
      - name: Print results
        if: always()
        run: cat lighthouse-baseline.json proxy-probe.json || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-baseline
          path: |
            lighthouse-baseline.json
            proxy-probe.json
