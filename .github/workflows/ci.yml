name: CI

# Runs on every pull request and on every push to main.
# See docs/ARCHITECTURE_PLAN.md (step 2) and AGENTS.md for what each check means.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint, types, tests, build, budgets, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # lint:changed diffs against the base branch
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Strict lint on changed files
        if: github.event_name == 'pull_request'
        run: npm run lint:changed -- origin/${{ github.base_ref }}
      - run: npm run type-check
      - run: npx jest --ci
      - run: npm run build
      - name: Bundle budgets
        run: npm run size:check
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse (accessibility gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start production server
        run: |
          npx next start -p 3000 &
          npx --yes wait-on@8 http://localhost:3000/robots.txt --timeout 60000
      - name: Lighthouse against this build (live backend data)
        run: |
          npm run baseline:lighthouse -- \
            --base http://localhost:3000 \
            --runs 1 \
            --min-accessibility 90 \
            --warn-performance 80 \
            --out lighthouse-ci.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-ci
          path: lighthouse-ci.json
          retention-days: 14
