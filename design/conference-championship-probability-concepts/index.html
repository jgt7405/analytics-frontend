<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JThom Football Conference Championship Concepts</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:1008px;height:1344px;overflow:hidden}body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:#f3f7f8;color:#102433}.poster{width:1008px;height:1344px;position:relative;overflow:hidden;background:var(--paper);padding:42px 46px 30px}.poster:before{content:"";position:absolute;inset:0;pointer-events:none}.header{height:137px;position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start}.kicker{font-size:10px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}.title{margin:0;font-size:39px;line-height:.98;letter-spacing:-.055em;font-weight:950}.deck{font-size:13px;color:#667884;margin-top:10px}.brand{width:210px;text-align:right}.brand img{width:190px;height:78px;object-fit:contain}.brand p{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#72828c;margin:0}.content{height:1115px;position:relative;z-index:2}.footer{height:20px;position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;font-size:7px;color:#71818b}.footer b{color:#20333f}.team-logo,.conf-logo{object-fit:contain}.pct{font-variant-numeric:tabular-nums}.conf-title{font-weight:900;letter-spacing:-.02em}.mini-name{font-weight:800}.mini-pct{font-weight:950;color:var(--accent)}

    body.v1{--paper:#f5fafb;--accent:#009db9}.v1 .poster:before{background:linear-gradient(90deg,rgba(0,157,185,.045) 1px,transparent 1px);background-size:52px 100%}.rows{display:grid;grid-template-rows:repeat(10,102px);gap:9px}.race-row{display:grid;grid-template-columns:145px 1fr 264px;background:#fff;border:1px solid #dce8eb;border-radius:15px;overflow:hidden;box-shadow:0 5px 14px rgba(20,61,74,.055)}.row-conf{display:grid;grid-template-columns:58px 1fr;align-items:center;padding:12px;background:#eaf4f6;border-right:1px solid #d5e5e9}.row-conf .conf-logo{width:50px;height:54px}.row-conf .conf-title{font-size:12px;line-height:1.05}.row-conf small{display:block;font-size:7px;color:#71828b;text-transform:uppercase;letter-spacing:.08em;margin-top:5px}.row-fav{display:grid;grid-template-columns:80px 1fr 94px;align-items:center;padding:7px 16px}.row-fav .team-logo{width:70px;height:70px}.row-fav .label{font-size:7px;color:var(--accent);font-weight:900;letter-spacing:.12em;text-transform:uppercase}.row-fav .name{font-size:21px;line-height:1;font-weight:950;letter-spacing:-.04em;margin-top:5px}.row-fav .pct{font-size:39px;line-height:1;font-weight:950;color:var(--accent);text-align:right;letter-spacing:-.06em}.row-others{display:grid;grid-template-rows:repeat(3,1fr);border-left:1px solid #dce8eb}.row-other{display:grid;grid-template-columns:28px 1fr 34px;align-items:center;gap:6px;padding:3px 10px}.row-other+.row-other{border-top:1px solid #e4edef}.row-other img{width:25px;height:25px}.row-other .mini-name{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-other .mini-pct{font-size:11px;text-align:right}

    body.v2{--paper:#fffdf7;--accent:#e67826}.v2 .poster:before{background:radial-gradient(circle at 88% 2%,#ffe3bb 0 11%,transparent 30%)}.tracks{display:grid;grid-template-rows:repeat(10,102px);gap:9px}.track{display:grid;grid-template-columns:136px 1fr;align-items:center;border-top:2px solid #233843;padding-top:7px}.track-conf{display:grid;grid-template-columns:52px 1fr;align-items:center}.track-conf img{width:45px;height:45px}.track-conf .conf-title{font-size:11px;line-height:1.05}.track-main{display:grid;grid-template-rows:58px 25px}.track-leader{display:grid;grid-template-columns:56px 1fr 70px;align-items:center}.track-leader img{width:50px;height:50px}.track-leader .name{font-size:19px;font-weight:950;letter-spacing:-.03em}.track-leader small{display:block;font-size:7px;text-transform:uppercase;letter-spacing:.12em;color:#77848a;margin-top:4px}.track-leader .pct{font-size:31px;font-weight:950;color:var(--accent);text-align:right}.bar{display:flex;height:24px;border-radius:5px;overflow:hidden;background:#e9e9e3}.seg{min-width:44px;display:flex;align-items:center;justify-content:center;gap:4px;border-right:2px solid #fff;color:#20323b;font-size:7px;font-weight:900;white-space:nowrap}.seg img{width:15px;height:15px}.seg.s1{background:#ffb86d}.seg.s2{background:#ffd29e}.seg.s3{background:#ffe5c3}.seg.field{background:#e5e9e7;color:#7e898c;flex:1;min-width:55px}

    body.v3{--paper:#f8f6ee;--accent:#087f99}.v3 .poster:before{background:linear-gradient(135deg,rgba(9,127,153,.045) 25%,transparent 25%) 0 0/42px 42px}.trail{height:1085px;position:relative}.trail:before{content:"";position:absolute;left:50%;top:20px;bottom:8px;width:4px;background:linear-gradient(#0a9cb6,#f0b755);transform:translateX(-50%);border-radius:5px}.trail-item{position:absolute;width:438px;height:96px;background:#fff;border:1px solid #dedfd7;border-radius:50px;box-shadow:0 6px 18px rgba(27,45,49,.07);display:grid;grid-template-columns:300px 1fr;align-items:center;padding:8px 18px}.trail-item.left{left:0}.trail-item.right{right:0}.trail-item.left:after,.trail-item.right:after{content:"";position:absolute;top:45px;width:24px;height:4px;background:#0a91aa}.trail-item.left:after{right:-24px}.trail-item.right:after{left:-24px}.trail-node{position:absolute;top:25px;width:46px;height:46px;border-radius:50%;background:#fff;border:4px solid var(--accent);display:grid;place-items:center;z-index:3}.left .trail-node{right:-70px}.right .trail-node{left:-70px}.trail-node img{width:31px;height:31px}.trail-fav{display:grid;grid-template-columns:70px 1fr 60px;align-items:center}.trail-fav>img{width:62px;height:62px}.trail-fav .name{font-size:17px;font-weight:950;line-height:1}.trail-fav .conf-title{font-size:8px;color:#77858b;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}.trail-fav .pct{font-size:25px;font-weight:950;color:var(--accent);text-align:right}.trail-mini{display:grid;grid-template-rows:repeat(3,1fr);border-left:1px solid #e4e4dd;padding-left:9px}.trail-mini div{font-size:6px;font-weight:800;display:flex;justify-content:space-between;gap:3px;line-height:16px}.trail-mini b{color:var(--accent)}

    body.v4{--paper:#fff;--accent:#bd4169}.v4 .poster:before{background:linear-gradient(105deg,transparent 0 72%,#f7e8ed 72%)}.mosaic{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,174px);gap:10px}.mosaic-card{position:relative;background:#f8f6f3;border-radius:18px;overflow:hidden;padding:15px;border:1px solid #ece7e2}.mosaic-card:nth-child(1),.mosaic-card:nth-child(6){grid-column:span 3;grid-row:span 2}.mosaic-card:nth-child(2),.mosaic-card:nth-child(3),.mosaic-card:nth-child(4),.mosaic-card:nth-child(5),.mosaic-card:nth-child(7),.mosaic-card:nth-child(8),.mosaic-card:nth-child(9),.mosaic-card:nth-child(10){grid-column:span 3;grid-row:span 1}.mosaic-card:nth-child(6){grid-column:4/span 3;grid-row:3/span 2}.mosaic-card:before{content:"";position:absolute;right:-30px;bottom:-35px;width:130px;height:130px;border-radius:50%;background:#f4dce4}.mosaic-head{height:30px;display:flex;align-items:center;position:relative;z-index:2}.mosaic-head .conf-logo{width:46px;height:28px;margin-right:8px}.mosaic-head .conf-title{font-size:11px}.mosaic-body{height:78px;display:grid;grid-template-columns:70px 1fr 78px;align-items:center;position:relative;z-index:2}.mosaic-body .team-logo{width:64px;height:64px}.mosaic-body .name{font-size:18px;font-weight:950;line-height:1;letter-spacing:-.035em}.mosaic-body .pct{font-size:30px;font-weight:950;color:var(--accent);text-align:right}.mosaic-chips{display:flex;gap:6px;position:relative;z-index:2}.mosaic-chip{height:42px;flex:1;border-radius:21px;background:#fff;display:grid;grid-template-columns:28px 1fr;align-items:center;padding:3px 7px;border:1px solid #eadde1}.mosaic-chip img{width:25px;height:25px}.mosaic-chip span{font-size:7px;font-weight:900;line-height:1.05}.mosaic-chip b{display:block;color:var(--accent);font-size:10px;margin-top:3px}.mosaic-card.tall .mosaic-body{height:180px;grid-template-columns:135px 1fr 110px}.mosaic-card.tall .mosaic-body .team-logo{width:126px;height:126px}.mosaic-card.tall .mosaic-body .name{font-size:28px}.mosaic-card.tall .mosaic-body .pct{font-size:50px}.mosaic-card.tall .mosaic-chips{margin-top:2px}

    body.v5{--paper:#f1f7f3;--accent:#147d6b}.v5 .poster:before{background:radial-gradient(circle at 50% 47%,rgba(20,125,107,.07),transparent 35%)}.gallery{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,535px);gap:15px 10px}.stage{background:#fff;border:1px solid #d8e4dc;border-radius:28px 28px 8px 8px;overflow:hidden;position:relative;text-align:center}.stage-head{height:72px;padding:10px 6px 4px;background:#e3f0e8}.stage-head img{width:47px;height:37px}.stage-head .conf-title{font-size:9px;line-height:1.05}.winner{height:247px;padding:14px 6px 4px;position:relative}.winner:after{content:"1";position:absolute;right:10px;top:7px;font-size:65px;line-height:1;font-weight:950;color:#e7eeea;z-index:0}.winner img{width:112px;height:112px;position:relative;z-index:1}.winner .name{font-size:16px;font-weight:950;line-height:1.05;position:relative;z-index:1;min-height:34px}.winner .pct{font-size:39px;font-weight:950;color:var(--accent);letter-spacing:-.06em;position:relative;z-index:1}.podium{height:214px;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:0 7px 9px}.step{width:53px;background:#e8f2ec;border-radius:7px 7px 2px 2px;padding:7px 2px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.step:nth-child(1){height:142px}.step:nth-child(2){height:175px;background:#d7e9df}.step:nth-child(3){height:118px}.step img{width:35px;height:35px}.step .mini-name{font-size:7px;line-height:1.05;margin-top:7px}.step .mini-pct{font-size:12px;margin-top:7px}
    .v5 .step:nth-child(1){height:175px;background:#d7e9df}.v5 .step:nth-child(2){height:142px;background:#e8f2ec}
  </style>
</head>
<body>
  <main class="poster"><header class="header"><div><div class="kicker" id="kicker"></div><h1 class="title" id="title"></h1><div class="deck" id="deck"></div></div><div class="brand"><img src="../../public/images/anim/logo_football.png" alt="JThom Analytics"><p>College Football • Preseason</p></div></header><section class="content" id="content"></section><footer class="footer"><span><b>Method:</b> JThom preseason simulation model</span><span>Whole-number probabilities • Independents excluded</span></footer></main>
  <script>
    const T='../../public/images/team_logos/',C='../../public/images/conf_logos/';
    const D=[
      ['American Athletic','American_Athletic.png',['Navy','navy.png',28.2],[['Tulane','tulane.png',16.5],['South Florida','south_florida.png',14.2],['East Carolina','east_carolina.png',11.5]]],
      ['Atlantic Coast','Atlantic_Coast.png',['Miami','miami.png',64.8],[['SMU','smu.png',11.6],['Louisville','louisville.png',10.4],['Virginia','virginia.png',3.4]]],
      ['Big 12','Big_12.png',['Texas Tech','texas_tech.png',57.7],[['BYU','byu.png',18.5],['Utah','utah.png',12.4],['TCU','tcu.png',2.9]]],
      ['Big Ten','Big_Ten.png',['Ohio State','ohio_state.png',35.7],[['Indiana','indiana.png',28],['Oregon','oregon.png',27.8],['Penn State','penn_state.png',2.7]]],
      ['Conference USA','Conference_USA.png',['Western Kentucky','western_kentucky.png',34.6],[['Jacksonville State','jacksonville_state.png',17.8],['Liberty','liberty.png',17.3],['Kennesaw State','kennesaw_state.png',11.6]]],
      ['Mid-American','Mid_American.png',['Western Michigan','western_michigan.png',28.7],[['Toledo','toledo.png',28.1],['Miami (OH)','miami_(oh).png',17.8],['Ohio','ohio.png',13.7]]],
      ['Mountain West','Mountain_West.png',['UNLV','unlv.png',32.5],[['New Mexico','new_mexico.png',21.9],['North Dakota State','north_dakota_state.png',19.8],['Hawaii','hawaii.png',11.9]]],
      ['Pac-12','Pac_12.png',['Boise State','boise_state.png',58.7],[['San Diego State','san_diego_state.png',13.4],['Washington State','washington_state.png',12.5],['Fresno State','fresno_state.png',6.7]]],
      ['Southeastern','Southeastern.png',['Georgia','georgia.png',32.5],[['Texas','texas.png',22.9],['Alabama','alabama.png',10.1],['Ole Miss','ole_miss.png',9.9]]],
      ['Sun Belt','Sun_Belt.png',['James Madison','james_madison.png',45.8],[['Old Dominion','old_dominion.png',23.1],['Arkansas State','arkansas_state.png',5.4],['Louisiana Tech','louisiana_tech.png',5.3]]]
    ];
    const P=n=>`${Math.round(n)}%`,img=(cls,src,alt='')=>`<img class="${cls}" src="${src}" alt="${alt}">`;
    const v=Math.max(1,Math.min(5,Number(new URLSearchParams(location.search).get('v')||1)));document.body.className=`v${v}`;
    const meta=[['01 • Power Rows','Every conference. One clean race.','Conference identity left, favorite center, three challengers stacked right.'],['02 • Probability Tracks','See the favorite—and the field.','Title odds become proportional race tracks instead of conventional cards.'],['03 • Championship Trail','The road to ten titles.','Conference favorites alternate along a central championship path.'],['04 • Editorial Mosaic','The preseason title issue.','An asymmetrical magazine collage with feature races and compact briefs.'],['05 • Podium Gallery','Who stands tallest?','Ten conference stages turn the forecast into a collection of podiums.']][v-1];
    document.getElementById('kicker').textContent=meta[0];document.getElementById('title').textContent=meta[1];document.getElementById('deck').textContent=meta[2];
    const confHead=d=>`${img('conf-logo',C+d[1])}<div class="conf-title">${d[0]}</div>`;
    function rows(){return `<div class="rows">${D.map(d=>`<article class="race-row"><div class="row-conf">${confHead(d)}<small>Title race</small></div><div class="row-fav">${img('team-logo',T+d[2][1])}<div><div class="label">Conference favorite</div><div class="name">${d[2][0]}</div></div><div class="pct">${P(d[2][2])}</div></div><div class="row-others">${d[3].map(t=>`<div class="row-other">${img('',T+t[1])}<span class="mini-name">${t[0]}</span><b class="mini-pct">${P(t[2])}</b></div>`).join('')}</div></article>`).join('')}</div>`}
    function tracks(){return `<div class="tracks">${D.map(d=>{let used=Math.round(d[2][2])+d[3].reduce((s,t)=>s+Math.round(t[2]),0);return `<article class="track"><div class="track-conf">${confHead(d)}</div><div class="track-main"><div class="track-leader">${img('',T+d[2][1])}<div><div class="name">${d[2][0]}</div><small>Conference favorite</small></div><div class="pct">${P(d[2][2])}</div></div><div class="bar"><div class="seg s1" style="flex:${Math.round(d[2][2])}">${P(d[2][2])}</div>${d[3].map((t,i)=>`<div class="seg s${i+2}" style="flex:${Math.round(t[2])}">${img('',T+t[1])}${P(t[2])}</div>`).join('')}<div class="seg field" style="flex:${Math.max(1,100-used)}">FIELD ${100-used}%</div></div></div></article>`}).join('')}</div>`}
    function trail(){return `<div class="trail">${D.map((d,i)=>`<article class="trail-item ${i%2?'right':'left'}" style="top:${i*107+6}px"><div class="trail-node">${img('',C+d[1])}</div><div class="trail-fav">${img('',T+d[2][1])}<div><div class="conf-title">${d[0]}</div><div class="name">${d[2][0]}</div></div><div class="pct">${P(d[2][2])}</div></div><div class="trail-mini">${d[3].map(t=>`<div><span>${t[0]}</span><b>${P(t[2])}</b></div>`).join('')}</div></article>`).join('')}</div>`}
    function mosaic(){return `<div class="mosaic">${D.map((d,i)=>`<article class="mosaic-card ${i===0||i===5?'tall':''}"><div class="mosaic-head">${confHead(d)}</div><div class="mosaic-body">${img('team-logo',T+d[2][1])}<div class="name">${d[2][0]}</div><div class="pct">${P(d[2][2])}</div></div><div class="mosaic-chips">${d[3].map(t=>`<div class="mosaic-chip">${img('',T+t[1])}<span>${t[0]}<b>${P(t[2])}</b></span></div>`).join('')}</div></article>`).join('')}</div>`}
    function gallery(){return `<div class="gallery">${D.map(d=>`<article class="stage"><div class="stage-head">${confHead(d)}</div><div class="winner">${img('',T+d[2][1])}<div class="name">${d[2][0]}</div><div class="pct">${P(d[2][2])}</div></div><div class="podium">${d[3].map(t=>`<div class="step">${img('',T+t[1])}<div class="mini-name">${t[0]}</div><div class="mini-pct">${P(t[2])}</div></div>`).join('')}</div></article>`).join('')}</div>`}
    document.getElementById('content').innerHTML=[rows,tracks,trail,mosaic,gallery][v-1]();
  </script>
</body>
</html>
