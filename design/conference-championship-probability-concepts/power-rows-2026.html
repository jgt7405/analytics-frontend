<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2026 Conference Champion Probabilities</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:1008px;height:1344px;overflow:hidden}body{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#112735;background:#f5fafb}.poster{width:1008px;height:1344px;padding:39px 46px 28px;position:relative;overflow:hidden;background:var(--paper)}.poster:before{content:"";position:absolute;inset:0;pointer-events:none}.header{height:142px;display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}.kicker{font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}.title{font-size:38px;line-height:.98;letter-spacing:-.055em;font-weight:950;margin:0}.deck{font-size:12px;color:#697b85;margin-top:10px}.brand{text-align:right;width:200px}.brand img{width:185px;height:75px;object-fit:contain}.brand div{font-size:7px;color:#75838a;letter-spacing:.16em;text-transform:uppercase}.rows{height:1105px;display:grid;grid-template-rows:repeat(10,101px);gap:10px;position:relative;z-index:2}.row{height:101px;position:relative;overflow:hidden}.conf{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.conf img{object-fit:contain}.conf-name{font-weight:900;line-height:1.05}.favorite{display:flex;align-items:center}.favorite img,.other img{object-fit:contain}.favorite-name{font-weight:950;line-height:1;letter-spacing:-.03em}.others{display:grid}.other{display:grid;align-items:center}.other-name{font-weight:800;line-height:1.05}.other-pct{font-weight:950;color:var(--accent);font-variant-numeric:tabular-nums}.donut{border-radius:50%;background:conic-gradient(var(--donut-color) 0 var(--fill),var(--donut-rest) var(--fill) 360deg);position:relative;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(16,54,69,.06)}.donut:after{content:"";position:absolute;width:67%;height:67%;border-radius:50%;background:var(--donut-hole)}.donut span{position:relative;z-index:2;font-weight:950;color:var(--donut-text);font-variant-numeric:tabular-nums;letter-spacing:-.04em}.footer{height:20px;display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:2;color:#78878e;font-size:7px}.footer b{color:#233946}

    /* A — balanced utility rows */
    body.a{--paper:#f4fafb;--accent:#009db8;--donut-color:#09a9c3;--donut-rest:#dcecef;--donut-hole:#fff;--donut-text:#087f96}.a .poster:before{background:linear-gradient(90deg,rgba(0,157,184,.04) 1px,transparent 1px);background-size:51px 100%}.a .row{display:grid;grid-template-columns:133px 310px 112px 1fr;background:#fff;border:1px solid #dbe7ea;border-radius:16px;box-shadow:0 4px 13px rgba(22,65,78,.055)}.a .conf{background:#eaf4f6;border-right:1px solid #d9e7ea}.a .conf img{width:52px;height:48px}.a .conf-name{font-size:10px;margin-top:4px;max-width:112px}.a .favorite{padding:8px 18px;gap:16px}.a .favorite img{width:72px;height:72px}.a .favorite-name{font-size:21px}.a .donut-wrap{display:grid;place-items:center}.a .donut{width:78px;height:78px}.a .donut span{font-size:20px}.a .others{grid-template-rows:repeat(3,1fr);border-left:1px solid #dfe9eb}.a .other{grid-template-columns:29px 1fr 33px;gap:7px;padding:2px 11px}.a .other+.other{border-top:1px solid #e5edef}.a .other img{width:25px;height:25px}.a .other-name{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.a .other-pct{font-size:11px;text-align:right}

    /* B — editorial bands with the donut as the hinge */
    body.b{--paper:#fffdf7;--accent:#d87424;--donut-color:#ef8b3b;--donut-rest:#f3e3d5;--donut-hole:#fffdf7;--donut-text:#b45b1d}.b .poster:before{background:radial-gradient(circle at 91% 3%,#ffe1b7 0 9%,transparent 28%)}.b .row{display:grid;grid-template-columns:120px 324px 104px 1fr;border-top:2px solid #1a3440}.b .conf{align-items:flex-start;text-align:left;padding-left:5px}.b .conf img{width:51px;height:45px}.b .conf-name{font-size:10px;margin-top:4px;max-width:110px}.b .favorite{gap:14px;position:relative}.b .favorite:before{content:"";position:absolute;left:0;right:14px;top:17px;bottom:13px;background:#fff3e5;border-radius:48px;z-index:0}.b .favorite img{width:73px;height:73px;position:relative;z-index:1;margin-left:11px}.b .favorite-name{font-size:20px;position:relative;z-index:1}.b .donut-wrap{display:grid;place-items:center}.b .donut{width:82px;height:82px}.b .donut span{font-size:21px}.b .others{grid-template-columns:repeat(3,1fr);gap:6px;align-items:center}.b .other{height:68px;grid-template-rows:28px 1fr;grid-template-columns:35px 1fr;padding:6px 7px;background:#fff;border:1px solid #eee2d6;border-radius:9px}.b .other img{width:28px;height:28px;grid-row:1/span 2}.b .other-name{font-size:7px;align-self:end}.b .other-pct{font-size:12px;align-self:start;margin-top:3px}

    /* C — logo rail and compact challenger ladder */
    body.c{--paper:#f8f7f2;--accent:#009db8;--donut-rest:#e4ebe7;--donut-hole:#fff;--donut-text:var(--conference)}.c .poster:before{background:linear-gradient(145deg,transparent 0 76%,rgba(0,157,184,.055) 76%)}.c .header{height:112px;align-items:flex-start}.c .title{font-size:40px;color:#009db8}.c .brand{width:178px}.c .brand img{width:170px;height:70px}.c .rows{height:1100px}.c .row{display:grid;grid-template-columns:118px 266px 116px 1fr;background:#fff;border-radius:6px;border-left:7px solid var(--conference);box-shadow:0 3px 11px rgba(31,66,55,.06)}.c .conf{background:color-mix(in srgb,var(--conference) 9%,white)}.c .conf img{width:50px;height:44px}.c .conf-name{font-size:12px;margin-top:5px;max-width:101px}.c .favorite{gap:13px;padding:7px 16px}.c .favorite img{width:70px;height:70px}.c .favorite-name{font-size:19px}.c .donut-wrap{display:grid;place-items:center;border-left:1px solid #e3ebe6;border-right:1px solid #e3ebe6}.c .donut{width:80px;height:80px;--donut-color:var(--conference)}.c .donut span{font-size:21px}.c .others{grid-template-rows:repeat(3,1fr);padding:4px 10px}.c .other{grid-template-columns:28px 1fr 31px;gap:6px}.c .other+.other{border-top:1px dashed #d7e4dc}.c .other img{width:24px;height:24px}.c .other-name{font-size:8px}.c .mini-donut{width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--conference) 0 var(--fill),#e4ebe7 var(--fill) 360deg);display:grid;place-items:center;position:relative}.c .mini-donut:after{content:"";position:absolute;width:66%;height:66%;border-radius:50%;background:#fff}.c .mini-donut span{position:relative;z-index:2;font-size:6px;font-weight:950;color:var(--conference);letter-spacing:-.04em}.c .footer{height:55px;border-top:1px solid #d8e4de;padding-top:10px;align-items:flex-start;font-size:10px;line-height:1.35;color:#344a55;font-weight:650}
  </style>
</head>
<body>
  <main class="poster">
    <header class="header"><h1 class="title">2026 Conference Champion Probabilities</h1><div class="brand"><img src="../../public/images/anim/logo_football.png" alt="JThom Analytics"></div></header>
    <section class="rows" id="rows"></section>
    <footer class="footer">Conference Championship Projections based on 1,000 season simulations using composite of multiple college football rating models. See details at jthomanalytics.com</footer>
  </main>
  <script>
    const T='../../public/images/team_logos/',C='../../public/images/conf_logos/';
    const D=[
      ['Big Ten','Big_Ten.png',['Ohio State','ohio_state.png',35.7],[['Indiana','indiana.png',28],['Oregon','oregon.png',27.8],['Penn State','penn_state.png',2.7]]],
      ['SEC','Southeastern.png',['Georgia','georgia.png',32.5],[['Texas','texas.png',22.9],['Alabama','alabama.png',10.1],['Ole Miss','ole_miss.png',9.9]]],
      ['Big 12','Big_12.png',['Texas Tech','texas_tech.png',57.7],[['BYU','byu.png',18.5],['Utah','utah.png',12.4],['TCU','tcu.png',2.9]]],
      ['ACC','Atlantic_Coast.png',['Miami','miami.png',64.8],[['SMU','smu.png',11.6],['Louisville','louisville.png',10.4],['Virginia','virginia.png',3.4]]],
      ['Pac-12','Pac_12.png',['Boise State','boise_state.png',58.7],[['San Diego State','san_diego_state.png',13.4],['Washington State','washington_state.png',12.5],['Fresno State','fresno_state.png',6.7]]],
      ['American Athletic','American_Athletic.png',['Navy','navy.png',28.2],[['Tulane','tulane.png',16.5],['South Florida','south_florida.png',14.2],['East Carolina','east_carolina.png',11.5]]],
      ['Sun Belt','Sun_Belt.png',['James Madison','james_madison.png',45.8],[['Old Dominion','old_dominion.png',23.1],['Arkansas State','arkansas_state.png',5.4],['Louisiana Tech','louisiana_tech.png',5.3]]],
      ['Mountain West','Mountain_West.png',['UNLV','unlv.png',32.5],[['New Mexico','new_mexico.png',21.9],['North Dakota State','north_dakota_state.png',19.8],['Hawaii','hawaii.png',11.9]]],
      ['Mid-American','Mid_American.png',['Western Michigan','western_michigan.png',28.7],[['Toledo','toledo.png',28.1],['Miami (OH)','miami_(oh).png',17.8],['Ohio','ohio.png',13.7]]],
      ['Conference USA','Conference_USA.png',['Western Kentucky','western_kentucky.png',34.6],[['Jacksonville State','jacksonville_state.png',17.8],['Liberty','liberty.png',17.3],['Kennesaw State','kennesaw_state.png',11.6]]]
    ];
    const P=n=>Math.round(n),variant=(new URLSearchParams(location.search).get('v')||'c').toLowerCase();document.body.className=['a','b','c'].includes(variant)?variant:'c';
    const COLORS={'Big Ten':'#0088CE','SEC':'#00549A','Big 12':'#C8102E','ACC':'#013CA6','Pac-12':'#243E70','American Athletic':'#003B70','Sun Belt':'#D38B00','Mountain West':'#5B2C83','Mid-American':'#007A3D','Conference USA':'#C8102E'};
    document.getElementById('rows').innerHTML=D.map(d=>{const p=P(d[2][2]),color=COLORS[d[0]];return `<article class="row" style="--conference:${color};--donut-color:${color};--donut-text:${color}"><div class="conf"><img src="${C+d[1]}" alt=""><div class="conf-name">${d[0]}</div></div><div class="favorite"><img src="${T+d[2][1]}" alt=""><div class="favorite-name">${d[2][0]}</div></div><div class="donut-wrap"><div class="donut" style="--fill:${p*3.6}deg"><span>${p}%</span></div></div><div class="others">${d[3].map(t=>{const tp=P(t[2]);return `<div class="other"><img src="${T+t[1]}" alt=""><div class="other-name">${t[0]}</div><div class="mini-donut" style="--fill:${tp*3.6}deg"><span>${tp}%</span></div></div>`}).join('')}</div></article>`}).join('');
  </script>
</body>
</html>
