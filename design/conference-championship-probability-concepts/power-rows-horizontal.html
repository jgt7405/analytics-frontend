  <style>
    *{box-sizing:border-box}html,body{margin:0;width:1008px;height:1344px;overflow:hidden}body{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#112735;background:#f8f7f2}.poster{width:1008px;height:1344px;padding:39px 46px 28px;position:relative;overflow:hidden;background:#f8f7f2}.poster:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 0 76%,rgba(0,157,184,.055) 76%);pointer-events:none}.header{height:112px;display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}.title{font-size:40px;line-height:.98;letter-spacing:-.055em;font-weight:950;margin:0;color:#009db8}.brand{width:178px;text-align:right}.brand img{width:170px;height:70px;object-fit:contain}.rows{height:1100px;display:grid;grid-template-rows:repeat(10,101px);gap:10px;position:relative;z-index:2}.row{height:101px;display:grid;background:#fff;border-radius:8px;border:3px solid var(--conference);box-shadow:0 3px 11px rgba(31,66,55,.06);overflow:hidden}.mode3 .row{grid-template-columns:115px repeat(3,1fr)}.mode4 .row{grid-template-columns:115px repeat(4,1fr)}.conf{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:color-mix(in srgb,var(--conference) 9%,white);border-right:2px solid color-mix(in srgb,var(--conference) 48%,#aab8b2)}.conf img{width:50px;height:42px;object-fit:contain}.conf-name{font-size:12px;font-weight:900;line-height:1.05;margin-top:4px;max-width:99px}.team{display:grid;align-items:center;position:relative;border-right:2px solid color-mix(in srgb,var(--conference) 34%,#b7c4bf)}.team:last-child{border-right:0}.conf + .team{background:color-mix(in srgb,var(--conference) 4%,white)}.mode3 .team{grid-template-columns:24px 52px 1fr 76px;padding:6px 8px;gap:5px}.mode4 .team{grid-template-columns:22px 38px 1fr 61px;padding:6px 5px;gap:3px}.rank{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#009db8;color:#fff;font-size:9px;font-weight:950;line-height:1;letter-spacing:-.04em;box-shadow:0 1px 3px rgba(17,39,53,.16)}.mode3 .rank{width:22px;height:22px;font-size:10px}.team-logo{object-fit:contain}.mode3 .team-logo{width:50px;height:55px}.mode4 .team-logo{width:38px;height:42px}.team-name{font-weight:900;line-height:1.04}.mode3 .team-name{font-size:13px}.mode4 .team-name{font-size:9px}.conf + .team .team-name{font-weight:950}.donut{border-radius:50%;background:conic-gradient(var(--team-color) 0 var(--fill),#e4ebe7 var(--fill) 360deg);position:relative;display:grid;place-items:center}.donut:after{content:"";position:absolute;width:61%;height:61%;border-radius:50%;background:#fff}.donut span{position:relative;z-index:2;font-weight:950;color:#173240;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.mode3 .donut{width:72px;height:72px}.mode3 .donut span{font-size:16px}.mode4 .donut{width:58px;height:58px}.mode4 .donut span{font-size:12px}.conf + .team .donut{box-shadow:0 0 0 3px color-mix(in srgb,var(--team-color) 13%,transparent)}.footer{height:55px;border-top:1px solid #d8e4de;padding-top:10px;display:flex;align-items:flex-start;position:relative;z-index:2;font-size:10px;line-height:1.35;color:#344a55;font-weight:650}

    .year2025.mode4 .row{grid-template-columns:115px repeat(4,minmax(0,1fr)) 100px}.actual{height:100%;display:grid;place-items:center;background:color-mix(in srgb,var(--conference) 7%,white)}.actual-logo{width:76px;height:76px;object-fit:contain}.actual-head{font-size:13px;letter-spacing:.05em}
